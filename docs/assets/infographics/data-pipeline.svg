<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">KakeFlow local-first data pipeline</title>
  <desc id="desc">Files move through encrypted evidence storage, extraction, review, a double-entry ledger, and household dashboards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f8f3"/><stop offset="1" stop-color="#eef2e8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#263329" flood-opacity=".09"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#6d7c61"/></marker>
  </defs>
  <rect width="1400" height="560" rx="28" fill="url(#bg)"/>
  <text x="70" y="78" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#243029">From documents to financial clarity</text>
  <text x="70" y="112" font-family="Inter,Arial,sans-serif" font-size="17" fill="#6f7972">Every number remains linked to encrypted source evidence.</text>
  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(60 175)"><rect width="210" height="245" rx="20" fill="#fff"/><circle cx="48" cy="48" r="25" fill="#e7eddf"/><text x="39" y="56" font-size="24">↓</text><text x="26" y="102" font-size="20" font-weight="700" fill="#243029">Inputs</text><text x="26" y="137" font-size="15" fill="#68736b">CSV / Excel</text><text x="26" y="165" font-size="15" fill="#68736b">PDF / Receipts</text><text x="26" y="193" font-size="15" fill="#68736b">Drive-synced folders</text><text x="26" y="221" font-size="15" fill="#68736b">Manual entry</text></g>
    <g transform="translate(335 175)"><rect width="210" height="245" rx="20" fill="#fff"/><circle cx="48" cy="48" r="25" fill="#e2ece9"/><text x="37" y="56" font-size="22">◇</text><text x="26" y="102" font-size="20" font-weight="700" fill="#243029">Evidence vault</text><text x="26" y="137" font-size="15" fill="#68736b">Immutable originals</text><text x="26" y="165" font-size="15" fill="#68736b">XChaCha20-Poly1305</text><text x="26" y="193" font-size="15" fill="#68736b">Hash + provenance</text><text x="26" y="221" font-size="15" fill="#68736b">Local-only storage</text></g>
    <g transform="translate(610 175)"><rect width="210" height="245" rx="20" fill="#fff"/><circle cx="48" cy="48" r="25" fill="#f4e7df"/><text x="37" y="56" font-size="22">⌁</text><text x="26" y="102" font-size="20" font-weight="700" fill="#243029">Normalize</text><text x="26" y="137" font-size="15" fill="#68736b">Adapters + OCR</text><text x="26" y="165" font-size="15" fill="#68736b">Deduplication</text><text x="26" y="193" font-size="15" fill="#68736b">Category suggestions</text><text x="26" y="221" font-size="15" fill="#68736b">Human review</text></g>
    <g transform="translate(885 175)"><rect width="210" height="245" rx="20" fill="#fff"/><circle cx="48" cy="48" r="25" fill="#eee7d8"/><text x="38" y="56" font-size="22">≡</text><text x="26" y="102" font-size="20" font-weight="700" fill="#243029">Ledger</text><text x="26" y="137" font-size="15" fill="#68736b">Balanced journals</text><text x="26" y="165" font-size="15" fill="#68736b">SQLCipher</text><text x="26" y="193" font-size="15" fill="#68736b">Card reconciliation</text><text x="26" y="221" font-size="15" fill="#68736b">Audit lineage</text></g>
    <g transform="translate(1160 175)"><rect width="180" height="245" rx="20" fill="#5e6e52"/><circle cx="48" cy="48" r="25" fill="#75836b"/><text x="36" y="56" font-size="22" fill="#fff">↗</text><text x="26" y="102" font-size="20" font-weight="700" fill="#fff">Insights</text><text x="26" y="137" font-size="15" fill="#edf1e9">Cash flow</text><text x="26" y="165" font-size="15" fill="#edf1e9">Net worth</text><text x="26" y="193" font-size="15" fill="#edf1e9">Budgets</text><text x="26" y="221" font-size="15" fill="#edf1e9">Savings goals</text></g>
  </g>
  <g stroke="#6d7c61" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M280 298h38"/><path d="M555 298h38"/><path d="M830 298h38"/><path d="M1105 298h38"/></g>
  <rect x="60" y="468" width="1280" height="46" rx="23" fill="#fff" opacity=".8"/><text x="700" y="498" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#53624d">Native desktop boundary • no bank scraping • no cloud upload required</text>
</svg>
