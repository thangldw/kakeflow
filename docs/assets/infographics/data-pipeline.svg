<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">KakeFlow local-first data pipeline</title>
  <desc id="desc">User-controlled sources pass through immutable evidence, extraction, explicit review, the double-entry ledger, and source-backed insights.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#050038" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1l10 5-10 5" fill="none" stroke="#34324a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#c9c7d8" opacity=".55"/></pattern>
    <style>
      .ui{font-family:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans JP",Arial,sans-serif}
      .title{font-size:34px;font-weight:800;fill:#050038}
      .subtitle{font-size:17px;fill:#68657a}
      .step{font-size:13px;font-weight:800;letter-spacing:.08em;fill:#68657a}
      .head{font-size:21px;font-weight:800;fill:#050038}
      .copy{font-size:15px;fill:#34324a}
      .small{font-size:13px;fill:#68657a}
      .connector{fill:none;stroke:#34324a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="620" rx="30" fill="#f7f7fb"/>
  <rect width="1400" height="620" rx="30" fill="url(#dots)"/>
  <g class="ui">
    <rect x="56" y="40" width="770" height="88" rx="18" fill="#fff" filter="url(#shadow)"/>
    <text x="84" y="78" class="title">From source documents to financial clarity</text>
    <text x="84" y="106" class="subtitle">Every confirmed number remains linked to immutable local evidence.</text>

    <path class="connector" d="M270 333C300 333 303 333 330 333"/>
    <path class="connector" d="M535 333C565 333 568 333 595 333"/>
    <path class="connector" d="M800 333C830 333 833 333 860 333"/>
    <path class="connector" d="M1065 333C1095 333 1098 333 1125 333"/>

    <g transform="translate(65 205) rotate(-1 100 130)" filter="url(#shadow)">
      <rect width="205" height="262" rx="12" fill="#fff3b8"/>
      <path d="M181 0h24v24z" fill="#f4da62"/>
      <circle cx="30" cy="32" r="17" fill="#ffd02f"/><text x="30" y="38" text-anchor="middle" class="head" font-size="16">1</text>
      <text x="24" y="75" class="step">USER INPUT</text>
      <text x="24" y="108" class="head">Sources</text>
      <text x="24" y="143" class="copy">CSV · XLSX · PDF</text>
      <text x="24" y="170" class="copy">Receipts · email</text>
      <text x="24" y="197" class="copy">Folders · connectors</text>
      <text x="24" y="230" class="small">No direct bank scraping</text>
    </g>

    <g transform="translate(330 205) rotate(1 100 130)" filter="url(#shadow)">
      <rect width="205" height="262" rx="12" fill="#cde7ff"/>
      <path d="M181 0h24v24z" fill="#9fcef7"/>
      <circle cx="30" cy="32" r="17" fill="#4262ff"/><text x="30" y="38" text-anchor="middle" fill="#fff" font-weight="800" font-size="16">2</text>
      <text x="24" y="75" class="step">LOCAL VAULT</text>
      <text x="24" y="108" class="head">Evidence</text>
      <text x="24" y="143" class="copy">Immutable originals</text>
      <text x="24" y="170" class="copy">SHA-256 provenance</text>
      <text x="24" y="197" class="copy">Encrypted storage</text>
      <text x="24" y="230" class="small">Bytes stay on device</text>
    </g>

    <g transform="translate(595 205) rotate(-.8 100 130)" filter="url(#shadow)">
      <rect width="205" height="262" rx="12" fill="#e5d7ff"/>
      <path d="M181 0h24v24z" fill="#c3a8f5"/>
      <circle cx="30" cy="32" r="17" fill="#8b5cf6"/><text x="30" y="38" text-anchor="middle" fill="#fff" font-weight="800" font-size="16">3</text>
      <text x="24" y="75" class="step">EXTRACT</text>
      <text x="24" y="108" class="head">Normalize</text>
      <text x="24" y="143" class="copy">Adapters + local OCR</text>
      <text x="24" y="170" class="copy">Row-level lineage</text>
      <text x="24" y="197" class="copy">Duplicate signals</text>
      <text x="24" y="230" class="small">Ambiguity fails closed</text>
    </g>

    <g transform="translate(860 205) rotate(.8 100 130)" filter="url(#shadow)">
      <rect width="205" height="262" rx="12" fill="#ffd6df"/>
      <path d="M181 0h24v24z" fill="#f4aabe"/>
      <circle cx="30" cy="32" r="17" fill="#f2476a"/><text x="30" y="38" text-anchor="middle" fill="#fff" font-weight="800" font-size="16">4</text>
      <text x="24" y="75" class="step">HUMAN GATE</text>
      <text x="24" y="108" class="head">Review</text>
      <text x="24" y="143" class="copy">Account mapping</text>
      <text x="24" y="170" class="copy">Resolve duplicates</text>
      <text x="24" y="197" class="copy">Approve balanced draft</text>
      <text x="24" y="230" class="small">Nothing auto-posts</text>
    </g>

    <g transform="translate(1125 205) rotate(-.5 100 130)" filter="url(#shadow)">
      <rect width="205" height="262" rx="12" fill="#c9f3df"/>
      <path d="M181 0h24v24z" fill="#98deb9"/>
      <circle cx="30" cy="32" r="17" fill="#2ccf8e"/><text x="30" y="38" text-anchor="middle" fill="#050038" font-weight="800" font-size="16">5</text>
      <text x="24" y="75" class="step">CONFIRMED</text>
      <text x="24" y="108" class="head">Ledger</text>
      <text x="24" y="143" class="copy">Balanced journals</text>
      <text x="24" y="170" class="copy">Cards + investments</text>
      <text x="24" y="197" class="copy">Reports + actions</text>
      <text x="24" y="230" class="small">Source-backed insights</text>
    </g>

    <g transform="translate(330 515) rotate(-1 0 0)" filter="url(#shadow)">
      <rect width="740" height="62" rx="10" fill="#fff"/>
      <rect width="12" height="62" rx="6" fill="#4262ff"/>
      <text x="35" y="27" class="head" font-size="17">The review boundary is the control point</text>
      <text x="35" y="48" class="small">Extraction prepares evidence; only explicit approval creates confirmed ledger facts.</text>
    </g>
  </g>
</svg>
