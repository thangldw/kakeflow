<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">KakeFlow audience-partitioned family delivery</title>
  <desc id="desc">A local household ledger creates separate shared and personal member partitions. An authenticated relay derives recipients from active memberships. Every receiving desktop validates, reviews, and explicitly applies its permitted partition.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#243029" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#77857b"/></marker>
  </defs>
  <rect width="1400" height="560" rx="28" fill="#f5f3ec"/>
  <text x="70" y="72" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700" fill="#243029">Family delivery without widening personal data</text>
  <text x="70" y="108" font-family="Inter,Arial,sans-serif" font-size="17" fill="#6f7972">Audience is derived from ledger scope and authenticated membership—not a typed recipient address.</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="70" y="172" width="270" height="260" rx="22" fill="#ffffff"/>
    <text x="100" y="215" font-size="20" font-weight="700" fill="#243029">Local ledger</text>
    <text x="100" y="245" font-size="15" fill="#6f7972">Current confirmed state</text>
    <rect x="100" y="280" width="210" height="50" rx="12" fill="#e7efe8"/><text x="205" y="311" text-anchor="middle" font-size="15" font-weight="700" fill="#405747">SHARED</text>
    <rect x="100" y="346" width="210" height="50" rx="12" fill="#eee9f6"/><text x="205" y="377" text-anchor="middle" font-size="15" font-weight="700" fill="#5a4d70">PERSONAL(member)</text>

    <rect x="565" y="172" width="270" height="260" rx="22" fill="#ffffff"/>
    <text x="595" y="215" font-size="20" font-weight="700" fill="#243029">Authenticated relay</text>
    <text x="595" y="245" font-size="15" fill="#6f7972">Server-derived membership</text>
    <rect x="595" y="280" width="210" height="50" rx="12" fill="#e7efe8"/><text x="700" y="311" text-anchor="middle" font-size="15" fill="#405747">All active members</text>
    <rect x="595" y="346" width="210" height="50" rx="12" fill="#eee9f6"/><text x="700" y="377" text-anchor="middle" font-size="15" fill="#5a4d70">Exact matching member</text>

    <rect x="1060" y="172" width="270" height="260" rx="22" fill="#ffffff"/>
    <text x="1090" y="215" font-size="20" font-weight="700" fill="#243029">Receiving desktop</text>
    <text x="1090" y="245" font-size="15" fill="#6f7972">No automatic ledger write</text>
    <rect x="1090" y="280" width="210" height="50" rx="12" fill="#edf0ec"/><text x="1195" y="311" text-anchor="middle" font-size="15" fill="#405047">Validate audience</text>
    <rect x="1090" y="346" width="210" height="50" rx="12" fill="#edf0ec"/><text x="1195" y="377" text-anchor="middle" font-size="15" fill="#405047">Review → explicit apply</text>
  </g>

  <path d="M340 305H565" stroke="#77857b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M835 305H1060" stroke="#77857b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="452" y="289" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#6f7972">separate artifacts</text>
  <text x="948" y="289" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#6f7972">permitted bytes only</text>

  <rect x="225" y="478" width="950" height="46" rx="23" fill="#ffffff" opacity=".86"/>
  <text x="700" y="507" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#53624d">Revocation blocks future access • downloaded copies remain local • evidence-dependent records stay withheld</text>
</svg>
