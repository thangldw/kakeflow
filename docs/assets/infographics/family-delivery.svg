<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">KakeFlow audience-partitioned family delivery</title>
  <desc id="desc">A confirmed local graph is split into shared and personal artifacts, routed by authenticated membership, validated on receipt, and applied only after review.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#050038" flood-opacity=".12"/></filter>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1l10 5-10 5" fill="none" stroke="#4262ff" stroke-width="2" stroke-linecap="round"/></marker>
    <marker id="arrowPurple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1l10 5-10 5" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/></marker>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#c9c7d8" opacity=".55"/></pattern>
    <style>
      .ui{font-family:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans JP",Arial,sans-serif}.title{font-size:34px;font-weight:800;fill:#050038}.subtitle{font-size:17px;fill:#68657a}.frame{font-size:21px;font-weight:850;fill:#050038}.label{font-size:13px;font-weight:850;letter-spacing:.06em}.copy{font-size:15px;fill:#34324a}.small{font-size:13px;fill:#68657a}.shared{fill:none;stroke:#4262ff;stroke-width:4;stroke-linecap:round;marker-end:url(#arrowBlue)}.personal{fill:none;stroke:#8b5cf6;stroke-width:4;stroke-linecap:round;marker-end:url(#arrowPurple)}
    </style>
  </defs>
  <rect width="1400" height="650" rx="30" fill="#f7f7fb"/><rect width="1400" height="650" rx="30" fill="url(#dots)"/>
  <g class="ui">
    <rect x="56" y="40" width="1040" height="88" rx="18" fill="#fff" filter="url(#shadow)"/>
    <text x="84" y="78" class="title">Family delivery without widening personal data</text>
    <text x="84" y="106" class="subtitle">The relay derives recipients from active membership—clients never type principal IDs.</text>

    <rect x="65" y="177" width="330" height="342" rx="20" fill="#fff" stroke="#dad8e5" stroke-width="2" filter="url(#shadow)"/>
    <text x="93" y="218" class="frame">1. Partition local state</text>
    <text x="93" y="245" class="small">Complete confirmed dependency graph</text>
    <g transform="translate(95 278) rotate(-1 0 0)" filter="url(#shadow)"><rect width="270" height="88" rx="10" fill="#cde7ff"/><text x="22" y="34" class="label" fill="#2946d3">SHARED</text><text x="22" y="61" class="copy">Household-visible facts</text></g>
    <g transform="translate(95 391) rotate(1 0 0)" filter="url(#shadow)"><rect width="270" height="88" rx="10" fill="#e5d7ff"/><text x="22" y="34" class="label" fill="#6940c7">PERSONAL(member)</text><text x="22" y="61" class="copy">Exact member-visible facts</text></g>

    <rect x="535" y="177" width="330" height="342" rx="20" fill="#fff" stroke="#dad8e5" stroke-width="2" filter="url(#shadow)"/>
    <text x="563" y="218" class="frame">2. Relay routes bytes</text>
    <text x="563" y="245" class="small">Authenticated membership generation</text>
    <g transform="translate(565 278) rotate(.8 0 0)" filter="url(#shadow)"><rect width="270" height="88" rx="10" fill="#cde7ff"/><text x="22" y="34" class="label" fill="#2946d3">SHARED ROUTE</text><text x="22" y="61" class="copy">Other active memberships</text></g>
    <g transform="translate(565 391) rotate(-.8 0 0)" filter="url(#shadow)"><rect width="270" height="88" rx="10" fill="#e5d7ff"/><text x="22" y="34" class="label" fill="#6940c7">PERSONAL ROUTE</text><text x="22" y="61" class="copy">Only matching member</text></g>

    <rect x="1005" y="177" width="330" height="342" rx="20" fill="#fff" stroke="#dad8e5" stroke-width="2" filter="url(#shadow)"/>
    <text x="1033" y="218" class="frame">3. Desktop reviews</text>
    <text x="1033" y="245" class="small">No receive action writes the ledger</text>
    <g transform="translate(1035 278) rotate(-.6 0 0)" filter="url(#shadow)"><rect width="270" height="78" rx="10" fill="#fff3b8"/><text x="22" y="33" class="label" fill="#765c00">VALIDATE</text><text x="22" y="58" class="copy">Schema · SHA · audience</text></g>
    <g transform="translate(1035 379) rotate(.7 0 0)" filter="url(#shadow)"><rect width="270" height="78" rx="10" fill="#c9f3df"/><text x="22" y="33" class="label" fill="#126840">EXPLICIT APPLY</text><text x="22" y="58" class="copy">Review conflicts atomically</text></g>

    <path class="shared" d="M365 321C430 321 470 321 565 321"/><path class="shared" d="M835 321C900 321 940 321 1035 321"/>
    <path class="personal" d="M365 435C430 435 470 435 565 435"/><path class="personal" d="M835 435C900 435 940 435 1035 435"/>

    <g transform="translate(260 560) rotate(-.5 0 0)" filter="url(#shadow)">
      <rect width="880" height="58" rx="10" fill="#ffd6df"/>
      <text x="440" y="25" text-anchor="middle" font-size="16" font-weight="850" fill="#050038">Mixed-member or missing-evidence graphs are withheld—not widened</text>
      <text x="440" y="46" text-anchor="middle" class="small">Revocation blocks future access; it cannot erase a copy already downloaded.</text>
    </g>
  </g>
</svg>
