<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
  <title id="title">KakeFlow mobile receipt capture flow</title>
  <desc id="desc">A mobile receipt moves through an immutable capsule, authenticated relay, local Capture Inbox, local OCR, explicit review, and only then the ledger.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#050038" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1l10 5-10 5" fill="none" stroke="#34324a" stroke-width="2" stroke-linecap="round"/></marker>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#c9c7d8" opacity=".55"/></pattern>
    <style>
      .ui{font-family:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans JP",Arial,sans-serif}.title{font-size:34px;font-weight:800;fill:#050038}.subtitle{font-size:17px;fill:#68657a}.label{font-size:12px;font-weight:850;letter-spacing:.07em;fill:#68657a}.head{font-size:19px;font-weight:850;fill:#050038}.copy{font-size:14px;fill:#34324a}.small{font-size:13px;fill:#68657a}.connector{fill:none;stroke:#34324a;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="650" rx="30" fill="#f7f7fb"/><rect width="1440" height="650" rx="30" fill="url(#dots)"/>
  <g class="ui">
    <rect x="56" y="40" width="960" height="88" rx="18" fill="#fff" filter="url(#shadow)"/>
    <text x="84" y="78" class="title">A captured image is evidence—not an expense</text>
    <text x="84" y="106" class="subtitle">Transport, OCR, review, and posting remain separate states with explicit user control.</text>

    <path class="connector" d="M270 338C295 338 305 338 330 338"/>
    <path class="connector" d="M535 338C560 338 570 338 595 338"/>
    <path class="connector" d="M800 338C825 338 835 338 860 338"/>
    <path class="connector" d="M1065 338C1090 338 1100 338 1125 338"/>

    <g transform="translate(65 205) rotate(-1 100 130)" filter="url(#shadow)">
      <rect width="205" height="270" rx="12" fill="#fff3b8"/><path d="M181 0h24v24z" fill="#f4da62"/>
      <circle cx="29" cy="31" r="16" fill="#ffd02f"/><text x="29" y="37" text-anchor="middle" font-size="15" font-weight="850" fill="#050038">1</text>
      <text x="22" y="73" class="label">MOBILE</text><text x="22" y="105" class="head">Capture image</text>
      <text x="22" y="141" class="copy">JPEG or PNG</text><text x="22" y="167" class="copy">SHARED / PERSONAL</text>
      <rect x="22" y="197" width="112" height="30" rx="15" fill="#ffd02f"/><text x="78" y="217" text-anchor="middle" font-size="12" font-weight="850" fill="#050038">NO OCR</text>
      <text x="22" y="251" class="small">Exact image digest</text>
    </g>

    <g transform="translate(330 205) rotate(.8 100 130)" filter="url(#shadow)">
      <rect width="205" height="270" rx="12" fill="#cde7ff"/><path d="M181 0h24v24z" fill="#9fcef7"/>
      <circle cx="29" cy="31" r="16" fill="#4262ff"/><text x="29" y="37" text-anchor="middle" font-size="15" font-weight="850" fill="#fff">2</text>
      <text x="22" y="73" class="label">TRANSPORT</text><text x="22" y="105" class="head">Opaque capsule</text>
      <text x="22" y="141" class="copy">Authenticated route</text><text x="22" y="167" class="copy">Immutable capture ID</text>
      <rect x="22" y="197" width="142" height="30" rx="15" fill="#4262ff"/><text x="93" y="217" text-anchor="middle" font-size="12" font-weight="850" fill="#fff">DIGEST CHECK</text>
      <text x="22" y="251" class="small">Relay stores exact bytes</text>
    </g>

    <g transform="translate(595 205) rotate(-.7 100 130)" filter="url(#shadow)">
      <rect width="205" height="270" rx="12" fill="#e5d7ff"/><path d="M181 0h24v24z" fill="#c3a8f5"/>
      <circle cx="29" cy="31" r="16" fill="#8b5cf6"/><text x="29" y="37" text-anchor="middle" font-size="15" font-weight="850" fill="#fff">3</text>
      <text x="22" y="73" class="label">DESKTOP</text><text x="22" y="105" class="head">Capture Inbox</text>
      <text x="22" y="141" class="copy">Encrypted original</text><text x="22" y="167" class="copy">Durable before OCR</text>
      <rect x="22" y="197" width="112" height="30" rx="15" fill="#8b5cf6"/><text x="78" y="217" text-anchor="middle" font-size="12" font-weight="850" fill="#fff">RECEIVED</text>
      <text x="22" y="251" class="small">No ledger mutation</text>
    </g>

    <g transform="translate(860 205) rotate(.7 100 130)" filter="url(#shadow)">
      <rect width="205" height="270" rx="12" fill="#ffd6df"/><path d="M181 0h24v24z" fill="#f4aabe"/>
      <circle cx="29" cy="31" r="16" fill="#f2476a"/><text x="29" y="37" text-anchor="middle" font-size="15" font-weight="850" fill="#fff">4</text>
      <text x="22" y="73" class="label">LOCAL PROCESS</text><text x="22" y="105" class="head">OCR + review</text>
      <text x="22" y="141" class="copy">Extract + normalize</text><text x="22" y="167" class="copy">Link or draft entries</text>
      <rect x="22" y="197" width="154" height="30" rx="15" fill="#f2476a"/><text x="99" y="217" text-anchor="middle" font-size="12" font-weight="850" fill="#fff">REVIEW_REQUIRED</text>
      <text x="22" y="251" class="small">Human decision required</text>
    </g>

    <g transform="translate(1125 205) rotate(-.5 100 130)" filter="url(#shadow)">
      <rect width="205" height="270" rx="12" fill="#c9f3df"/><path d="M181 0h24v24z" fill="#98deb9"/>
      <circle cx="29" cy="31" r="16" fill="#2ccf8e"/><text x="29" y="37" text-anchor="middle" font-size="15" font-weight="850" fill="#050038">5</text>
      <text x="22" y="73" class="label">CONFIRMED</text><text x="22" y="105" class="head">Ledger</text>
      <text x="22" y="141" class="copy">Explicit approval</text><text x="22" y="167" class="copy">Balanced journal</text>
      <rect x="22" y="197" width="103" height="30" rx="15" fill="#2ccf8e"/><text x="73" y="217" text-anchor="middle" font-size="12" font-weight="850" fill="#050038">POSTED</text>
      <text x="22" y="251" class="small">Or evidence link only</text>
    </g>

    <g transform="translate(280 530) rotate(-.6 0 0)" filter="url(#shadow)">
      <rect width="880" height="68" rx="10" fill="#fff"/>
      <rect width="12" height="68" rx="6" fill="#f2476a"/>
      <text x="38" y="29" font-size="17" font-weight="850" fill="#050038">Accounting invariant</text>
      <text x="38" y="51" class="small">Matching a receipt to an existing card purchase adds provenance and never creates another expense.</text>
    </g>
  </g>
</svg>
