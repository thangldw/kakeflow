<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" role="img" aria-labelledby="title desc">
  <title id="title">KakeFlow mobile receipt capture flow</title>
  <desc id="desc">A receipt image moves from a mobile browser through an authenticated relay to an immutable desktop inbox, local OCR, human review, and finally the ledger only after explicit confirmation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b1a"/><stop offset="1" stop-color="#102a27"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".24"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#77d6b0"/></marker>
    <style>
      .card{fill:#102f2b;stroke:#3d6b61;stroke-width:2;rx:20;filter:url(#shadow)}
      .step{font:700 22px Inter,system-ui,-apple-system,'Segoe UI','Noto Sans JP',Arial,sans-serif;fill:#f2fbf7}
      .copy{font:500 15px Inter,system-ui,-apple-system,'Segoe UI','Noto Sans JP',Arial,sans-serif;fill:#b9d4ca}
      .tag{font:700 13px Inter,system-ui,-apple-system,'Segoe UI','Noto Sans JP',Arial,sans-serif;fill:#071b1a}
      .arrow{stroke:#77d6b0;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="540" rx="28" fill="url(#bg)"/>
  <text x="64" y="66" class="step" font-size="30">Receipt evidence stays pending until you confirm it</text>
  <text x="64" y="96" class="copy">受信・OCR・レビュー・台帳反映を別々の状態として管理</text>
  <g transform="translate(64 150)">
    <rect class="card" width="220" height="210"/>
    <circle cx="44" cy="44" r="22" fill="#77d6b0"/><text x="44" y="50" text-anchor="middle" class="tag">1</text>
    <text x="28" y="94" class="step">Mobile capture</text>
    <text x="28" y="126" class="copy">JPEG / PNG</text><text x="28" y="151" class="copy">SHARED or PERSONAL</text>
    <rect x="28" y="174" width="126" height="24" rx="12" fill="#77d6b0"/><text x="91" y="191" text-anchor="middle" class="tag">NO OCR</text>
  </g>
  <path class="arrow" d="M294 255 H350"/>
  <g transform="translate(360 150)">
    <rect class="card" width="220" height="210"/>
    <circle cx="44" cy="44" r="22" fill="#77d6b0"/><text x="44" y="50" text-anchor="middle" class="tag">2</text>
    <text x="28" y="94" class="step">Capture relay</text>
    <text x="28" y="126" class="copy">Authenticated routing</text><text x="28" y="151" class="copy">Digest + immutable ID</text>
    <rect x="28" y="174" width="154" height="24" rx="12" fill="#77d6b0"/><text x="105" y="191" text-anchor="middle" class="tag">OPAQUE BYTES</text>
  </g>
  <path class="arrow" d="M590 255 H646"/>
  <g transform="translate(656 150)">
    <rect class="card" width="220" height="210"/>
    <circle cx="44" cy="44" r="22" fill="#77d6b0"/><text x="44" y="50" text-anchor="middle" class="tag">3</text>
    <text x="28" y="94" class="step">Capture Inbox</text>
    <text x="28" y="126" class="copy">Encrypted original</text><text x="28" y="151" class="copy">Durable before OCR</text>
    <rect x="28" y="174" width="136" height="24" rx="12" fill="#ffd98a"/><text x="96" y="191" text-anchor="middle" class="tag">PENDING</text>
  </g>
  <path class="arrow" d="M886 255 H942"/>
  <g transform="translate(952 150)">
    <rect class="card" width="220" height="210"/>
    <circle cx="44" cy="44" r="22" fill="#77d6b0"/><text x="44" y="50" text-anchor="middle" class="tag">4</text>
    <text x="28" y="94" class="step">Local OCR</text>
    <text x="28" y="126" class="copy">Extract + normalize</text><text x="28" y="151" class="copy">Human review required</text>
    <rect x="28" y="174" width="154" height="24" rx="12" fill="#ffd98a"/><text x="105" y="191" text-anchor="middle" class="tag">REVIEW_REQUIRED</text>
  </g>
  <path class="arrow" d="M1182 255 H1238"/>
  <g transform="translate(1248 150)">
    <rect class="card" width="128" height="210"/>
    <circle cx="44" cy="44" r="22" fill="#77d6b0"/><text x="44" y="50" text-anchor="middle" class="tag">5</text>
    <text x="24" y="94" class="step">Ledger</text>
    <text x="24" y="126" class="copy">Only after</text><text x="24" y="151" class="copy">confirmation</text>
    <rect x="24" y="174" width="80" height="24" rx="12" fill="#77d6b0"/><text x="64" y="191" text-anchor="middle" class="tag">POSTED</text>
  </g>
  <rect x="64" y="414" width="1312" height="70" rx="18" fill="#0b2321" stroke="#385d55"/>
  <text x="92" y="446" class="step" font-size="18">Accounting invariant</text>
  <text x="92" y="472" class="copy">A downloaded image is evidence—not an expense. Matching an existing card purchase never creates another journal entry.</text>
</svg>
