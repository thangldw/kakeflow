<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">Credit card reconciliation without double counting</title>
  <desc id="desc">Card purchases create expenses and card liability; the later bank debit reduces the liability without recording another expense.</desc>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#263329" flood-opacity=".08"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#6c7a61"/></marker></defs>
  <rect width="1400" height="500" rx="28" fill="#f7f8f3"/>
  <text x="70" y="74" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700" fill="#243029">Credit-card reconciliation without double counting</text>
  <text x="70" y="108" font-family="Inter,Arial,sans-serif" font-size="17" fill="#6f7972">Expense timing and bank cash flow are separate views of the same liability lifecycle.</text>
  <g font-family="Inter,Arial,sans-serif" filter="url(#s)">
    <g transform="translate(70 160)"><rect width="330" height="210" rx="20" fill="#fff"/><text x="28" y="44" font-size="14" font-weight="700" fill="#a45c49">PURCHASES</text><text x="28" y="82" font-size="25" font-weight="700" fill="#243029">¥60,000 expense</text><text x="28" y="119" font-size="15" fill="#6f7972">Groceries  ¥30,000</text><text x="28" y="147" font-size="15" fill="#6f7972">Amazon  ¥20,000</text><text x="28" y="175" font-size="15" fill="#6f7972">Restaurant  ¥10,000</text></g>
    <g transform="translate(535 160)"><rect width="330" height="210" rx="20" fill="#fff"/><text x="28" y="44" font-size="14" font-weight="700" fill="#6c7a61">CARD STATEMENT</text><text x="28" y="82" font-size="25" font-weight="700" fill="#243029">¥60,000 liability</text><text x="28" y="122" font-size="15" fill="#6f7972">Debit: household expenses</text><text x="28" y="151" font-size="15" fill="#6f7972">Credit: card payable</text><rect x="28" y="174" width="274" height="8" rx="4" fill="#e5e9e1"/><rect x="28" y="174" width="274" height="8" rx="4" fill="#718064"/></g>
    <g transform="translate(1000 160)"><rect width="330" height="210" rx="20" fill="#5e6e52"/><text x="28" y="44" font-size="14" font-weight="700" fill="#dfe8d8">BANK SETTLEMENT</text><text x="28" y="82" font-size="25" font-weight="700" fill="#fff">−¥60,000 cash</text><text x="28" y="122" font-size="15" fill="#edf1e9">Debit: card payable</text><text x="28" y="151" font-size="15" fill="#edf1e9">Credit: bank account</text><text x="28" y="184" font-size="14" font-weight="700" fill="#dfe8d8">Expense impact: ¥0</text></g>
  </g>
  <g stroke="#6c7a61" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M420 265h95"/><path d="M885 265h95"/></g>
  <g font-family="Inter,Arial,sans-serif"><rect x="430" y="405" width="540" height="48" rx="24" fill="#e8eee3"/><text x="700" y="436" text-anchor="middle" font-size="16" font-weight="700" fill="#526149">One purchase lifecycle • one expense • accurate cash flow</text></g>
</svg>
