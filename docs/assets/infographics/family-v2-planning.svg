<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">KakeFlow family planning and configuration delivery</title>
  <desc id="desc">Complete planning and configuration aggregates pass through audience dependency checks, become shared or personal artifacts, and require review before atomic apply. Evidence-dependent facts remain withheld.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#050038" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1l10 5-10 5" fill="none" stroke="#34324a" stroke-width="2" stroke-linecap="round"/></marker>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#c9c7d8" opacity=".55"/></pattern>
    <style>
      .ui{font-family:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans JP",Arial,sans-serif}.title{font-size:34px;font-weight:800;fill:#050038}.subtitle{font-size:17px;fill:#68657a}.frame{font-size:22px;font-weight:850;fill:#050038}.label{font-size:13px;font-weight:850;letter-spacing:.06em}.copy{font-size:15px;fill:#34324a}.small{font-size:13px;fill:#68657a}.connector{fill:none;stroke:#34324a;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="820" rx="32" fill="#f7f7fb"/><rect width="1440" height="820" rx="32" fill="url(#dots)"/>
  <g class="ui">
    <rect x="56" y="38" width="1060" height="90" rx="18" fill="#fff" filter="url(#shadow)"/>
    <text x="84" y="77" class="title">Family planning moves as complete, audience-safe aggregates</text>
    <text x="84" y="106" class="subtitle">Dependency checks happen before bytes are routed; every destination still reviews before Apply.</text>

    <rect x="55" y="170" width="390" height="510" rx="20" fill="#fff" stroke="#dad8e5" stroke-width="2" filter="url(#shadow)"/>
    <text x="83" y="213" class="frame">1. Local confirmed state</text>
    <text x="83" y="241" class="small">Whole aggregates, deterministic child order</text>
    <g transform="translate(87 275) rotate(-1 0 0)" filter="url(#shadow)"><rect width="155" height="78" rx="10" fill="#fff3b8"/><text x="18" y="31" class="label" fill="#765c00">PLAN</text><text x="18" y="57" class="copy">Monthly budgets</text></g>
    <g transform="translate(257 274) rotate(.8 0 0)" filter="url(#shadow)"><rect width="155" height="78" rx="10" fill="#c9f3df"/><text x="18" y="31" class="label" fill="#126840">GOALS</text><text x="18" y="57" class="copy">Savings targets</text></g>
    <g transform="translate(87 370) rotate(.7 0 0)" filter="url(#shadow)"><rect width="155" height="78" rx="10" fill="#e5d7ff"/><text x="18" y="31" class="label" fill="#6940c7">RULES</text><text x="18" y="57" class="copy">Labels + tags</text></g>
    <g transform="translate(257 371) rotate(-.7 0 0)" filter="url(#shadow)"><rect width="155" height="78" rx="10" fill="#cde7ff"/><text x="18" y="31" class="label" fill="#2946d3">GROUPS</text><text x="18" y="57" class="copy">Ordered accounts</text></g>
    <g transform="translate(87 466) rotate(-.5 0 0)" filter="url(#shadow)"><rect width="155" height="78" rx="10" fill="#ffd6df"/><text x="18" y="31" class="label" fill="#a3294c">MAPPING</text><text x="18" y="57" class="copy">Card → bank</text></g>
    <g transform="translate(257 466) rotate(.6 0 0)" filter="url(#shadow)"><rect width="155" height="78" rx="10" fill="#d6f1ef"/><text x="18" y="31" class="label" fill="#146b65">DISPLAY</text><text x="18" y="57" class="copy">Dashboard layout</text></g>
    <g transform="translate(87 562) rotate(.4 0 0)" filter="url(#shadow)"><rect width="325" height="78" rx="10" fill="#ecebf3"/><text x="18" y="31" class="label" fill="#4f4c63">PARSER PROFILE</text><text x="18" y="57" class="copy">Versioned CSV / TSV mapping</text></g>

    <path class="connector" d="M445 422C478 422 492 422 525 422"/>
    <rect x="525" y="210" width="350" height="426" rx="20" fill="#fff" stroke="#dad8e5" stroke-width="2" filter="url(#shadow)"/>
    <text x="553" y="253" class="frame">2. Audience meet</text>
    <text x="553" y="281" class="small">Least-widening result across dependencies</text>
    <g transform="translate(556 315) rotate(-.6 0 0)" filter="url(#shadow)"><rect width="288" height="66" rx="10" fill="#cde7ff"/><text x="18" y="27" class="label" fill="#2946d3">SHARED + SHARED</text><text x="270" y="44" text-anchor="end" class="copy">SHARED</text></g>
    <g transform="translate(556 399) rotate(.6 0 0)" filter="url(#shadow)"><rect width="288" height="66" rx="10" fill="#e5d7ff"/><text x="18" y="27" class="label" fill="#6940c7">SHARED + PERSONAL A</text><text x="270" y="44" text-anchor="end" class="copy">PERSONAL A</text></g>
    <g transform="translate(556 483) rotate(-.4 0 0)" filter="url(#shadow)"><rect width="288" height="66" rx="10" fill="#ffd6df"/><text x="18" y="27" class="label" fill="#a3294c">PERSONAL A + B</text><text x="270" y="44" text-anchor="end" class="copy">WITHHOLD</text></g>
    <text x="553" y="590" class="copy">No row splitting · no audience widening</text>
    <text x="553" y="615" class="small">Missing or mixed dependency stays local.</text>

    <path class="connector" d="M875 422C908 422 922 422 955 422"/>
    <rect x="955" y="170" width="430" height="510" rx="20" fill="#fff" stroke="#dad8e5" stroke-width="2" filter="url(#shadow)"/>
    <text x="983" y="213" class="frame">3. Deliver and review</text>
    <text x="983" y="241" class="small">Separate immutable artifacts</text>
    <g transform="translate(990 280) rotate(-.8 0 0)" filter="url(#shadow)"><rect width="360" height="115" rx="10" fill="#cde7ff"/><text x="24" y="38" class="label" fill="#2946d3">SHARED ARTIFACT</text><text x="24" y="69" class="copy">Household graph + shared plans</text><text x="24" y="94" class="small">All active recipient memberships</text></g>
    <g transform="translate(990 425) rotate(.7 0 0)" filter="url(#shadow)"><rect width="360" height="115" rx="10" fill="#e5d7ff"/><text x="24" y="38" class="label" fill="#6940c7">PERSONAL(MEMBER) ARTIFACT</text><text x="24" y="69" class="copy">Only matching member dependencies</text><text x="24" y="94" class="small">No household fallback</text></g>
    <rect x="990" y="574" width="360" height="62" rx="31" fill="#2ccf8e"/>
    <text x="1170" y="601" text-anchor="middle" font-size="16" font-weight="850" fill="#050038">Download → review → atomic Apply</text>
    <text x="1170" y="622" text-anchor="middle" class="small">Nothing applies automatically</text>

    <g transform="translate(155 720) rotate(-.5 0 0)" filter="url(#shadow)">
      <rect width="1130" height="62" rx="10" fill="#fff3b8"/>
      <text x="26" y="26" font-size="16" font-weight="850" fill="#050038">Evidence gate</text>
      <text x="26" y="48" class="small">Card and investment facts remain withheld until source origin, exact bytes, raw rows, and links can travel together.</text>
    </g>
  </g>
</svg>
