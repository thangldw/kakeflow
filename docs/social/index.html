<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KakeFlow social export</title>
  <link rel="stylesheet" href="social.css">
</head>
<body>
  <main id="top" class="social-card" data-card>
    <div class="wash" aria-hidden="true"></div>
    <header>
      <div class="wordmark">kake<span>flow</span></div>
      <div class="release">v1.2.0</div>
    </header>

    <section class="copy">
      <p class="eyebrow" data-copy="eyebrow"></p>
      <h1 data-copy="title"></h1>
      <p class="lede" data-copy="lede"></p>
      <ul data-copy="features"></ul>
    </section>

    <figure class="product-frame">
      <div class="window-bar" aria-hidden="true"><i></i><i></i><i></i><b>KakeFlow</b></div>
      <img data-product-image src="../assets/demo/overview-vi.jpg" width="1280" height="720" alt="KakeFlow application overview">
    </figure>

    <footer>
      <span data-copy="footer"></span>
      <strong>github.com/thangldw/kakeflow</strong>
    </footer>
  </main>
  <script src="social.js"></script>
</body>
</html>
