[package]
name = "kakeflow-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "Deterministic posting and key-derivation core for KakeFlow runtimes"
license = "MIT"
repository = "https://github.com/thangldw/kakeflow"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
argon2 = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
zeroize = "1.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
# wasm-pack bundles platform-specific wasm-opt binaries whose byte output is not
# stable across macOS and Linux. The core is small; skip that non-reproducible
# post-processing so CI can verify the committed WASM byte-for-byte.
wasm-opt = false
