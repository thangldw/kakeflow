[package]
name = "kakeflow-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "Deterministic posting and key-derivation core for KakeFlow runtimes"
license = "MIT"
repository = "https://github.com/thangldw/kakeflow"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
argon2 = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
zeroize = "1.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
