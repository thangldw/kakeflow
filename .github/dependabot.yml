version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      react-stack:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vitest-tooling:
        patterns: ["vitest", "@vitest/*"]
        update-types: ["minor", "patch"]
      web-tooling-security:
        applies-to: security-updates
        patterns: ["vite", "vitest", "@vitest/*", "postcss", "nanoid", "source-map-js", "browserslist", "baseline-browser-mapping", "undici"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      tauri-minor-patch:
        patterns: ["tauri", "tauri-*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      runner-actions:
        patterns: ["actions/*"]
        update-types: ["minor", "patch"]
