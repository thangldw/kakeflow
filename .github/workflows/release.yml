name: Release desktop apps

# Hosted runners are currently unavailable under the repository's monthly
# Actions quota. Tags are released from locally verified artifacts with
# `gh release create`; keep this workflow opt-in for when hosted CI returns.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer-acceptance:
    name: Gate Windows NSIS publication
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust 1.97.0
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: Prefer Strawberry Perl for OpenSSL
        shell: pwsh
        run: |
          $perlBin = 'C:\Strawberry\perl\bin'
          if (-not (Test-Path "$perlBin\perl.exe")) {
            choco install strawberryperl --yes --no-progress
          }
          $perlBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-all-crates: false
          cache-on-failure: false
          save-if: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Stage pinned Windows OCR resources
        shell: pwsh
        run: npm run ocr:stage:windows

      - name: Build unsigned Windows NSIS acceptance candidate
        run: npm run desktop:build:windows

      - name: Install, launch, and uninstall Windows candidate
        env:
          KAKEFLOW_SMOKE_ARTIFACT_DIR: artifacts/packaged-smoke/Windows
        run: npm run test:windows-installer

      - name: Upload pre-publication Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-acceptance-${{ github.ref_name }}
          path: artifacts/packaged-smoke/Windows
          if-no-files-found: error

  release:
    name: Release (${{ matrix.name }})
    needs: windows-installer-acceptance
    runs-on: ${{ matrix.runner }}
    env:
      PERL: ${{ matrix.perl }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-14
            bundles: app,dmg
            perl: perl
          - name: Windows x64
            runner: windows-2022
            bundles: nsis
            perl: C:\Strawberry\perl\bin\perl.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust 1.97.0
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: Prefer Strawberry Perl for OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perlBin = 'C:\Strawberry\perl\bin'
          if (-not (Test-Path "$perlBin\perl.exe")) {
            choco install strawberryperl --yes --no-progress
          }
          $perlBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-all-crates: false
          cache-on-failure: false
          save-if: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Stage and verify pinned macOS OCR resources
        if: runner.os == 'macOS'
        run: |
          npm run ocr:stage:mac
          npm run ocr:verify

      - name: Stage and verify pinned Windows OCR resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run ocr:stage:windows
          npm run ocr:verify

      - name: Test release candidate
        run: npm run desktop:smoke

      - name: Build and publish unsigned desktop bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: KakeFlow ${{ github.ref_name }}
          releaseBody: |
            Local-first household finance desktop application for macOS and Windows.

            See CHANGELOG.md for the release's financial calendar, reports,
            recurring/anomaly insights, account scopes, exports, and later additions.

            This automated release is unsigned/ad-hoc. macOS Gatekeeper and
            Windows SmartScreen may warn until production signing certificates are configured.
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
