name: Release desktop apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-14
            bundles: app,dmg
          - name: Windows x64
            runner: windows-2022
            bundles: nsis

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust 1.97.0
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: Prefer Strawberry Perl for OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perlBin = 'C:\Strawberry\perl\bin'
          if (-not (Test-Path "$perlBin\perl.exe")) {
            choco install strawberryperl --yes --no-progress
          }
          $perlBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-all-crates: false
          cache-on-failure: false
          save-if: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Test release candidate
        run: npm run desktop:smoke

      - name: Build and publish unsigned desktop bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: KakeFlow ${{ github.ref_name }}
          releaseBody: |
            Local-first household finance desktop application for macOS and Windows.

            See CHANGELOG.md for the release's financial calendar, reports,
            recurring/anomaly insights, account scopes, exports, and later additions.

            This automated release is unsigned/ad-hoc. macOS Gatekeeper and
            Windows SmartScreen may warn until production signing certificates are configured.
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
