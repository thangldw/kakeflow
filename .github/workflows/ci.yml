name: CI

# Hosted runners cannot currently start under the repository's monthly Actions
# quota. Release gates run locally; keep CI opt-in until quota is available.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check application version consistency
        run: npm run check:versions

  desktop-smoke:
    name: Desktop smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    env:
      PERL: ${{ matrix.perl }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-14
            perl: perl
            package-script: desktop:build:mac:ci
          - name: Windows
            runner: windows-2022
            perl: C:\Strawberry\perl\bin\perl.exe
            package-script: desktop:build:windows

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust 1.97.0
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
          rustup default 1.97.0

      - name: Prefer Strawberry Perl for OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perlBin = 'C:\Strawberry\perl\bin'
          if (-not (Test-Path "$perlBin\perl.exe")) {
            choco install strawberryperl --yes --no-progress
          }
          $perlBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-all-crates: false
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Stage pinned macOS OCR resources
        if: runner.os == 'macOS'
        run: npm run ocr:stage:mac

      - name: Stage pinned Windows OCR resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm run ocr:stage:windows

      - name: Run non-destructive desktop validation
        run: npm run desktop:smoke

      - name: Build unsigned packaged application
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: npm run ${{ matrix.package-script }}

      - name: Launch and validate packaged application
        env:
          KAKEFLOW_SMOKE_ARTIFACT_DIR: artifacts/packaged-smoke/${{ matrix.name }}
        run: npm run test:packaged

      - name: Install, launch, and uninstall Windows NSIS package
        if: runner.os == 'Windows'
        env:
          KAKEFLOW_SMOKE_ARTIFACT_DIR: artifacts/packaged-smoke/${{ matrix.name }}
        run: npm run test:windows-installer

      - name: Mount and validate macOS DMG
        if: runner.os == 'macOS'
        env:
          KAKEFLOW_SMOKE_ARTIFACT_DIR: artifacts/packaged-smoke/${{ matrix.name }}
        run: npm run test:dmg

      - name: Upload packaged UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-smoke-${{ matrix.name }}
          path: artifacts/packaged-smoke/${{ matrix.name }}
          if-no-files-found: error
