name: Bug report
description: Report a reproducible KakeFlow problem without attaching private financial data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not upload real bank statements, receipts, account numbers, OAuth credentials, encryption keys or local databases.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows
        - Development build
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KakeFlow version
      placeholder: 1.2.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use invented or anonymized values only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal financial data and credentials from this report.
          required: true
