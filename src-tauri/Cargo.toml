[package]
name = "kakeflow"
version = "1.2.1"
description = "Local-first household finance desktop application"
authors = ["KakeFlow contributors"]
license = "MIT"
repository = "https://github.com/thangldw/kakeflow"
edition = "2021"
rust-version = "1.97"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "kakeflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
kakeflow-core = { path = "../crates/kakeflow-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.4.2"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite_migration = "2.3"
sha2 = "0.10"
unicode-normalization = "0.1"
thiserror = "2"
zeroize = "1.8"
base64 = "0.22"
getrandom = "0.2"
chacha20poly1305 = "0.10"
hkdf = "0.12"
x25519-dalek = { version = "3.0", features = ["static_secrets", "zeroize"] }
argon2 = { version = "0.5", features = ["zeroize"] }
pdf-extract = "0.12"
encoding_rs = "0.8"
notify = "8.2.0"
hayro = "0.7.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rust_xlsxwriter = "0.96.0"
printpdf = { version = "0.9.1", default-features = false, features = ["text_layout"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.0"

[dev-dependencies]
tempfile = "3"
zip = "7.2.0"
