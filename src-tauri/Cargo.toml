[package]
name = "kakeflow"
version = "0.19.0"
description = "Local-first household finance desktop application"
authors = ["KakeFlow contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.97"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "kakeflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.4.2"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite_migration = "2.3"
sha2 = "0.10"
thiserror = "2"
zeroize = "1.8"
base64 = "0.22"
getrandom = "0.2"
chacha20poly1305 = "0.10"
hkdf = "0.12"
argon2 = { version = "0.5", features = ["zeroize"] }
pdf-extract = "0.12"
notify = "8.2.0"
hayro = "0.7.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"
