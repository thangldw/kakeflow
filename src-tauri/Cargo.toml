[package]
name = "kakeflow"
version = "0.1.0"
description = "Local-first household finance desktop application"
authors = ["KakeFlow contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "kakeflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite_migration = "2.3"
sha2 = "0.10"
thiserror = "2"
zeroize = "1.8"
